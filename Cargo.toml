[workspace]
resolver = "2"
members = ["crates/craftspace-core", "crates/craftspace", "crates/craftspace-cli"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emircesur/craftspace"
rust-version = "1.85"

[workspace.dependencies]
craftspace-core = { path = "crates/craftspace-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
