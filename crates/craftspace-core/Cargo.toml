[package]
name = "craftspace-core"
description = "Catalog, release discovery, download, install and update logic for CraftSpace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
log.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
directories = "6"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
walkdir = "2"
self-replace = "1"
md4 = "0.10"
sha1 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
